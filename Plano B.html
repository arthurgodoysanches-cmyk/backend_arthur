<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Máquinas de Guerra - Elite Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 20px; height: 20px;
            border: 2px solid rgba(0, 255, 136, 0.5); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 5;
        }
        /* Mira Sniper */
        #sniper-scope {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 30%, black 70%);
            display: none; align-items: center; justify-content: center; z-index: 10;
        }
        #scope-line-h { width: 100%; height: 2px; background: red; position: absolute; opacity: 0.5; }
        #scope-line-v { width: 2px; height: 100%; background: red; position: absolute; opacity: 0.5; }

        #ui { position: absolute; width: 100%; height: 100%; pointer-events: none; color: white; }
        .hud-panel { position: absolute; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #444; border-radius: 4px; }
        #p-stats { bottom: 20px; left: 20px; width: 250px; border-left: 5px solid #00ff88; }
        #b-stats { bottom: 20px; right: 20px; border-right: 5px solid #ff4444; text-align: right; }
        #round-stats { top: 20px; left: 50%; transform: translateX(-50%); text-align: center; font-weight: bold; }
        
        .hp-bar { width: 100%; height: 8px; background: #222; margin-top: 5px; }
        #hp-fill { width: 100%; height: 100%; background: #00ff88; transition: 0.2s; }
        #b-hp-fill { width: 100%; height: 100%; background: #ff4444; transition: 0.2s; }

        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #000, #1a1a1a); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; color: white;
        }
        .btn {
            padding: 12px 60px; margin: 10px; font-size: 18px; cursor: pointer;
            background: transparent; border: 2px solid #00ff88; color: #00ff88; font-weight: bold;
        }
        .btn:hover { background: #00ff88; color: #000; }
    </style>
</head>
<body>

    <div id="sniper-scope">
        <div id="scope-line-h"></div>
        <div id="scope-line-v"></div>
    </div>
    <div id="crosshair"></div>

    <div id="ui">
        <div id="round-stats" class="hud-panel">
            ROUND <span id="r-num">1</span> / 5<br>
            JOGADOR <span id="p-score">0</span> | BOT <span id="b-score">0</span>
        </div>
        <div id="p-stats" class="hud-panel">
            <span id="w-name" style="color: #00ff88; font-size: 20px;">PISTOLA</span><br>
            AMMO: <span id="ammo-val">50</span>
            <div class="hp-bar"><div id="hp-fill"></div></div>
        </div>
        <div id="b-stats" class="hud-panel">
            MECH MK-IV<br>
            STATUS: ATIVO
            <div class="hp-bar"><div id="b-hp-fill"></div></div>
        </div>
    </div>

    <div id="menu">
        <h1 style="letter-spacing: 10px;">MÁQUINAS DE GUERRA</h1>
        <p>SISTEMA DE COMBATE INICIADO</p>
        <button class="btn" onclick="initGame(0.8)">FÁCIL</button>
        <button class="btn" onclick="initGame(1.5)">MÉDIO</button>
        <button class="btn" onclick="initGame(2.8)">ELITE</button>
    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

    <script>
        let scene, camera, renderer, bot, weapon, bullets = [], obstacles = [], ammoPacks = [];
        let hpP = 1000, hpB = 1000, ammo = 50, pWins = 0, bWins = 0, round = 1, diff = 1;
        let move = {f:0, b:0, l:0, r:0}, mouse = {yaw:0, pitch:0}, vY = 0, lastS = 0;
        let active = false, raycaster = new THREE.Raycaster();

        const WEAPONS = {
            1: {n:"Pistola Neon", d:45, r:250, c:0x00ff88, s:[0.1, 0.2, 0.4], cost:1, type:"bullet"},
            2: {n:"SMG Carbono", d:20, r:80, c:0x00ffff, s:[0.12, 0.18, 0.6], cost:1, type:"bullet"},
            3: {n:"Rifle Vulcão", d:50, r:400, c:0xffaa00, s:[0.15, 0.22, 0.9], cost:1, type:"bullet"},
            4: {n:"Shotgun Cromo", d:25, r:900, c:0xcccccc, s:[0.2, 0.25, 0.7], p:7, cost:5, type:"bullet"},
            5: {n:"Sniper Plasma", d:250, r:1500, c:0xff00ff, s:[0.12, 0.12, 1.4], cost:10, type:"sniper", zoom: 0.2},
            6: {n:"Lança-Chamas", d:12, r:30, c:0xff4400, s:[0.2, 0.2, 0.8], cost:1, type:"flame"},
            7: {n:"Railgun", d:500, r:2200, c:0x0088ff, s:[0.2, 0.2, 1.6], cost:20, type:"bullet"},
            8: {n:"Laser Industrial", d:15, r:50, c:0xff0000, s:[0.08, 0.08, 1.2], cost:1, type:"bullet"}
        };
        let curW = WEAPONS[1];

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.Fog(0x050505, 20, 150);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x404040, 1));
            const light = new THREE.PointLight(0x00ff88, 1, 100);
            light.position.set(10, 20, 10);
            scene.add(light);

        
            const grid = new THREE.GridHelper(400, 80, 0x00ff88, 0x222222);
            scene.add(grid);

            createMap();
            createBot();
            updateWeaponModel();

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement) {
                    mouse.yaw -= e.movementX * 0.002;
                    mouse.pitch -= e.movementY * 0.002;
                    mouse.pitch = Math.max(-1.5, Math.min(1.5, mouse.pitch));
                }
            });

            window.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') move.f = 1; if (e.code === 'KeyS') move.b = 1;
                if (e.code === 'KeyA') move.l = 1; if (e.code === 'KeyD') move.r = 1;
                if (e.code === 'Space' && Math.abs(vY) < 0.01) vY = 0.2;
                if (WEAPONS[e.key]) { curW = WEAPONS[e.key]; updateWeaponModel(); exitZoom(); }
            });
            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') move.f = 0; if (e.code === 'KeyS') move.b = 0;
                if (e.code === 'KeyA') move.l = 0; if (e.code === 'KeyD') move.r = 0;
            });
            window.addEventListener('mousedown', (e) => {
                if(e.button === 0) shoot();
                if(e.button === 2 && curW.type === "sniper") enterZoom();
            });
            window.addEventListener('mouseup', (e) => {
                if(e.button === 2) exitZoom();
            });
            window.oncontextmenu = (e) => e.preventDefault();

            setInterval(spawnAmmoPack, 7000);
        }

        function enterZoom() {
            camera.fov = 75 * curW.zoom;
            camera.updateProjectionMatrix();
            document.getElementById('sniper-scope').style.display = 'flex';
            document.getElementById('crosshair').style.display = 'none';
            weapon.visible = false;
        }

        function exitZoom() {
            camera.fov = 75;
            camera.updateProjectionMatrix();
            document.getElementById('sniper-scope').style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            if(weapon) weapon.visible = true;
        }

        function createMap() {
            const mat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1, metalness: 0.5 });
            for (let i = 0; i < 45; i++) {
                const h = Math.random() * 15 + 5;
                const b = new THREE.Mesh(new THREE.BoxGeometry(7, h, 7), mat);
                b.position.set((Math.random()-0.5)*160, h/2, (Math.random()-0.5)*160);
                scene.add(b);
                obstacles.push(b);
                const edge = new THREE.BoxHelper(b, 0x00ff88);
                scene.add(edge);
            }
        }

        function createBot() {
            bot = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.5, 1.2), new THREE.MeshStandardMaterial({color: 0x222222}));
            const head = new THREE.Mesh(new THREE.BoxGeometry(1, 0.8, 1), new THREE.MeshStandardMaterial({color: 0x444444}));
            head.position.y = 1.7;
            const armL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.5, 0.4), new THREE.MeshStandardMaterial({color: 0x333333}));
            armL.position.set(1.2, 1, 0);
            const armR = armL.clone(); armR.position.x = -1.2;
            const eye = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.1), new THREE.MeshBasicMaterial({color: 0xff0000}));
            eye.position.set(0, 1.8, 0.51);
            bot.add(body, head, armL, armR, eye);
            scene.add(bot);
        }

        function updateWeaponModel() {
            if (weapon) scene.remove(weapon);
            weapon = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(...curW.s), new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 1 }));
            const light = new THREE.Mesh(new THREE.BoxGeometry(curW.s[0]+0.01, 0.05, curW.s[2]*0.6), new THREE.MeshBasicMaterial({color: curW.c}));
            light.position.y = 0.1;
            weapon.add(body, light);
            scene.add(weapon);
            document.getElementById('w-name').innerText = curW.n.toUpperCase();
            document.getElementById('w-name').style.color = `#${curW.c.toString(16).padStart(6, '0')}`;
        }

        function spawnAmmoPack() {
            if(!active) return;
            const box = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), new THREE.MeshStandardMaterial({color: 0x00ff88, emissive: 0x00ff88}));
            box.position.set((Math.random()-0.5)*130, 0.6, (Math.random()-0.5)*130);
            scene.add(box);
            ammoPacks.push(box);
        }

        function checkCollision(nextPos) {
            const pBox = new THREE.Box3().setFromCenterAndSize(nextPos, new THREE.Vector3(1.2, 2, 1.2));
            for (let obs of obstacles) {
                if (pBox.intersectsBox(new THREE.Box3().setFromObject(obs))) return true;
            }
            return false;
        }

        function shoot() {
            if (!active || ammo < curW.cost || Date.now() - lastS < curW.r) return;
            lastS = Date.now();
            ammo -= curW.cost;
            
            const count = curW.p || 1;
            for(let i=0; i<count; i++) {
                let size = curW.type === "flame" ? 0.4 : 0.15;
                const b = new THREE.Mesh(new THREE.SphereGeometry(size), new THREE.MeshBasicMaterial({color: curW.c}));
                b.position.copy(camera.position);
                const d = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                
                if(curW.type === "flame") {
                    d.x += (Math.random()-0.5)*0.2; d.y += (Math.random()-0.5)*0.2;
                    b.velocity = d.normalize().multiplyScalar(0.8);
                    b.life = 1.0; 
                } else {
                    if(count > 1) { d.x += (Math.random()-0.5)*0.15; d.y += (Math.random()-0.5)*0.15; }
                    b.velocity = d.normalize().multiplyScalar(2.5);
                }
                
                b.owner = "p"; b.dmg = curW.d; b.wType = curW.type;
                bullets.push(b); scene.add(b);
            }
        }

        function initGame(d) {
            diff = d;
            document.getElementById('menu').style.display = 'none';
            document.body.requestPointerLock();
            if(!scene) initScene();
            resetRound();
            active = true;
            loop();
        }

        function resetRound() {
            hpP = 1000; hpB = 1000; ammo = 50;
            camera.position.set(0, 1.7, 70);
            bot.position.set(0, 1.5, -70);
            bullets.forEach(b => scene.remove(b));
            bullets = [];
            exitZoom();
        }

        function loop() {
            if (!active) return;
            requestAnimationFrame(loop);

            vY -= 0.01; camera.position.y += vY;
            if (camera.position.y <= 1.7) { camera.position.y = 1.7; vY = 0; }
            camera.rotation.set(mouse.pitch, mouse.yaw, 0, 'YXZ');
            const dir = new THREE.Vector3();
            if (move.f) dir.z -= 1; if (move.b) dir.z += 1;
            if (move.l) dir.x -= 1; if (move.r) dir.x += 1;
            dir.applyQuaternion(camera.quaternion); dir.y = 0;
            const nP = camera.position.clone().add(dir.normalize().multiplyScalar(0.25));
            if (!checkCollision(nP)) camera.position.copy(nP);

            weapon.position.copy(camera.position); weapon.quaternion.copy(camera.quaternion);
            weapon.translateZ(-0.8); weapon.translateX(0.4); weapon.translateY(-0.35);

            bot.lookAt(camera.position.x, 1.5, camera.position.z);
            const bDist = bot.position.distanceTo(camera.position);
            const bDir = new THREE.Vector3().subVectors(camera.position, bot.position).normalize();
            raycaster.set(bot.position, bDir);
            const hit = raycaster.intersectObjects(obstacles);
            const canSee = hit.length === 0 || hit[0].distance > bDist;

            if (canSee && bDist < 80) {
                if (Math.random() < 0.02 * diff) {
                    const b = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: 0xff0000}));
                    b.position.copy(bot.position);
                    b.velocity = bDir.clone().multiplyScalar(1.5);
                    b.owner = "b"; bullets.push(b); scene.add(b);
                }
                bot.position.add(bDir.multiplyScalar(0.08 * diff));
            } else {
                bot.position.add(new THREE.Vector3(bDir.z, 0, -bDir.x).multiplyScalar(0.12 * diff));
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i]; b.position.add(b.velocity);
                
                if(b.wType === "flame") {
                    b.life -= 0.05;
                    b.scale.setScalar(b.life * 3);
                    if(b.life <= 0) { scene.remove(b); bullets.splice(i, 1); continue; }
                }

                let wall = false;
                for(let o of obstacles) if (new THREE.Box3().setFromObject(o).containsPoint(b.position)) wall = true;

                if (wall || b.position.length() > 250) {
                    scene.remove(b); bullets.splice(i, 1); continue;
                }

                if (b.owner === "p" && b.position.distanceTo(bot.position) < 2.5) {
                    hpB -= b.dmg; scene.remove(b); bullets.splice(i, 1);
                } else if (b.owner === "b" && b.position.distanceTo(camera.position) < 1.6) {
                    hpP -= 40 * diff; scene.remove(b); bullets.splice(i, 1);
                }
            }

            ammoPacks.forEach((p, i) => {
                p.rotation.y += 0.05;
                if(camera.position.distanceTo(p.position) < 2.5) {
                    ammo += 50; scene.remove(p); ammoPacks.splice(i, 1);
                }
            });

            document.getElementById('hp-fill').style.width = (hpP/10) + "%";
            document.getElementById('b-hp-fill').style.width = (hpB/10) + "%";
            document.getElementById('ammo-val').innerText = ammo;
            document.getElementById('r-num').innerText = round;
            document.getElementById('p-score').innerText = pWins;
            document.getElementById('b-score').innerText = bWins;

            if (hpP <= 0 || hpB <= 0) {
                if (hpP <= 0) bWins++; else pWins++;
                if (pWins >= 3 || bWins >= 3) {
                    alert(pWins >= 3 ? "VITÓRIA" : "DERROTA");
                    location.reload();
                } else {
                    round++; resetRound();
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
